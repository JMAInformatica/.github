# Prova temporária. Sem actions/checkout: a política deste repositório
# recusa actions de fora da JMAInformatica no lint, e o checkout nem entra aqui.
name: Probe cosign

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  install:
    name: Instalar cosign e assinar blob
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Versão do cosign
        run: cosign version

      - name: Assinatura keyless de um blob
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          printf 'probe\n' > payload.txt
          cosign sign-blob --yes --bundle payload.sigstore.json payload.txt
          repo_re="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
          cosign verify-blob \
            --bundle payload.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${repo_re}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            payload.txt
