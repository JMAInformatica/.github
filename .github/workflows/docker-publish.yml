name: Publicar imagem

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Caminho do Dockerfile relativo à raiz do repositório chamador.
        type: string
        required: true
      context:
        description: Contexto de build. O padrão é a raiz do repositório.
        type: string
        required: false
        default: .
      image:
        description: Imagem em ghcr.io. O padrão é ghcr.io/<owner>/<repo> em minúsculas.
        type: string
        required: false
        default: ""
      target:
        description: Estágio alvo do Dockerfile. Vazio publica o estágio final.
        type: string
        required: false
        default: ""
      build-args:
        description: Argumentos de build, um KEY=VALUE por linha. Não inclua segredo.
        type: string
        required: false
        default: ""
      platforms:
        description: Plataformas do buildx, separadas por vírgula.
        type: string
        required: false
        default: linux/amd64
      test-command:
        description: >-
          Comando bash executado depois do build local e antes do push.
          A imagem de teste está em $IMAGE. Se o comando falhar, nada é publicado.
          O teste roda em linux/amd64.
        type: string
        required: false
        default: ""
      version:
        description: >-
          Versão já calculada, sem o prefixo v. Informe junto com channel quando
          o mesmo commit publica várias imagens. Vazio calcula a versão aqui.
        type: string
        required: false
        default: ""
      channel:
        description: daily ou final. Obrigatório quando version é informada.
        type: string
        required: false
        default: ""
      bump:
        description: major, minor ou patch. Usado só quando version está vazia.
        type: string
        required: false
        default: ""
    outputs:
      image:
        description: Nome da imagem publicada, sem tag.
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Digest da imagem publicada.
        value: ${{ jobs.publish.outputs.digest }}
      tags:
        description: Referências publicadas, uma por linha.
        value: ${{ jobs.publish.outputs.tags }}
      version:
        description: Versão de marketing sem o prefixo v.
        value: ${{ jobs.publish.outputs.version }}
      channel:
        description: daily ou final.
        value: ${{ jobs.publish.outputs.channel }}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  version:
    name: Calcular versão
    if: inputs.version == ''
    permissions:
      contents: write
    uses: ./.github/workflows/version.yml
    with:
      bump: ${{ inputs.bump }}

  publish:
    name: Build e push
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.prep.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.prep.outputs.version }}
      channel: ${{ steps.prep.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar imagem e tags
        id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_BUILD_ARGS: ${{ inputs.build-args }}
          INPUT_TEST: ${{ inputs.test-command }}
          COMPUTED_VERSION: ${{ needs.version.outputs.version }}
          COMPUTED_CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            channel="$INPUT_CHANNEL"
          else
            version="${COMPUTED_VERSION#v}"
            channel="$COMPUTED_CHANNEL"
          fi
          if [[ "$channel" != "daily" && "$channel" != "final" ]]; then
            echo "channel inválido: '${channel}'. Use daily ou final." >&2
            exit 1
          fi
          if [[ "$channel" == "daily" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versão diária inválida: '${version}'. Esperado AAAA.M.D.N." >&2
            exit 1
          fi
          if [[ "$channel" == "final" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versão final inválida: '${version}'. Esperado X.Y.Z." >&2
            exit 1
          fi
          if printf '%s\n' "$INPUT_BUILD_ARGS" | grep -Eiq '^[A-Za-z0-9_.-]*(token|password|secret|private_key|api_key)[[:space:]]*='; then
            echo "build-args não pode carregar segredo. O build recebe só argumentos públicos." >&2
            exit 1
          fi
          if [[ -n "$INPUT_TEST" && "$INPUT_PLATFORMS" != *linux/amd64* ]]; then
            echo "test-command roda em linux/amd64 antes do push. Inclua linux/amd64 em platforms." >&2
            exit 1
          fi

          if [[ -n "$INPUT_IMAGE" ]]; then
            image="$(printf '%s' "$INPUT_IMAGE" | tr '[:upper:]' '[:lower:]')"
          else
            image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          fi
          if [[ "$image" != ghcr.io/*/* ]]; then
            echo "A imagem deve ser ghcr.io/<owner>/<nome>. Recebido: ${image}" >&2
            exit 1
          fi

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          scope="$(printf '%s-%s' "$image" "$INPUT_TARGET" | tr '/:' '--' | tr -cd '[:alnum:]._-' )"
          sha_short="${GITHUB_SHA:0:7}"

          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "image=${image}"
            echo "major=${major}"
            echo "major_minor=${major}.${minor}"
            echo "sha_short=${sha_short}"
            echo "cache_scope=${scope}"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de teste
        if: inputs.test-command != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: jma-test:local
          cache-from: type=gha,scope=${{ steps.prep.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.cache_scope }}

      - name: Testar imagem
        if: inputs.test-command != ''
        env:
          IMAGE: jma-test:local
          VERSION: ${{ steps.prep.outputs.version }}
          CHANNEL: ${{ steps.prep.outputs.channel }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$TEST_COMMAND"

      - name: Metadados OCI e tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.channel == 'daily' }}
            type=raw,value=edge,enable=${{ steps.prep.outputs.channel == 'daily' }}
            type=raw,value=sha-${{ steps.prep.outputs.sha_short }},enable=${{ steps.prep.outputs.channel == 'daily' }}
            type=raw,value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.channel == 'final' }}
            type=raw,value=${{ steps.prep.outputs.major_minor }},enable=${{ steps.prep.outputs.channel == 'final' }}
            type=raw,value=${{ steps.prep.outputs.major }},enable=${{ steps.prep.outputs.channel == 'final' }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.channel == 'final' }}
          labels: |
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.vendor=JMA Informática

      - name: Build e push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.cache_scope }}

      # A tag móvel v4 não existe. A linha 4 publicada é v4.1.2.
      - name: Instalar cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Assinar imagem (keyless)
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          # O SAN é o workflow reutilizável (job_workflow_ref), não o chamador.
          # A extensão de repositório do certificado continua sendo o chamador.
          attempt=1
          until cosign verify \
            --certificate-identity-regexp '^https://github.com/JMAInformatica/\.github/\.github/workflows/docker-publish\.yml@.*' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            "${IMAGE}@${DIGEST}"
          do
            if ((attempt >= 3)); then
              echo "A assinatura keyless não pôde ser verificada." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Resumo
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.prep.outputs.version }}
          CHANNEL: ${{ steps.prep.outputs.channel }}
        run: |
          {
            echo "### Imagem ${IMAGE}"
            echo ""
            echo "- Canal: \`${CHANNEL}\`"
            echo "- Versão: \`${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
