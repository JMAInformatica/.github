name: Validar workflows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, shellcheck e versão
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar shellcheck e actionlint
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: actionlint
        # actionlint 1.7.12 ainda não aceita $/. O padrão só ignora essa forma.
        run: >-
          actionlint -color
          -ignore 'specifying action "\$/.+" in invalid format because ref is missing'

      - name: shellcheck
        run: shellcheck .github/actions/version/version.sh tests/version_test.sh

      - name: Testes da versão
        run: bash tests/version_test.sh
