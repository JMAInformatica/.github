# Prova temporária. Sem actions/checkout: a política deste repositório
# só aceita actions da JMAInformatica.
name: Probe @main

on:
  pull_request:

permissions:
  contents: read

jobs:
  pinned:
    name: owner/repo@main sem checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Referência fixa
        id: calc
        continue-on-error: true
        uses: JMAInformatica/.github/.github/actions/version@main
        with:
          default-branch: main

      - name: Registrar resultado
        run: echo "outcome=${{ steps.calc.outcome }}"
